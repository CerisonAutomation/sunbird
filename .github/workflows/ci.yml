name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (Vercel / direct / PWA)
        env:
          VITE_PORTAL_TARGET: none
        run: npm run build:vercel

      - name: Upload dist artifact (Vercel)
        uses: actions/upload-artifact@v4
        with:
          name: sunbird-dist-vercel
          path: dist/
          retention-days: 14

  build-itch:
    name: Build (itch.io single-file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (itch.io singlefile)
        env:
          VITE_PORTAL_TARGET: none
          VITE_SINGLEFILE: "true"
        run: npm run build:itch
      - uses: actions/upload-artifact@v4
        with:
          name: sunbird-dist-itch
          path: dist/
          retention-days: 14

  portal-poki:
    name: Build (Poki)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (Poki portal)
        env:
          VITE_PORTAL_TARGET: poki
        run: npm run build:poki
      - uses: actions/upload-artifact@v4
        with:
          name: sunbird-dist-poki
          path: dist/
          retention-days: 14

  portal-crazy:
    name: Build (CrazyGames)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (CrazyGames portal)
        env:
          VITE_PORTAL_TARGET: crazy
        run: npm run build:crazy
      - uses: actions/upload-artifact@v4
        with:
          name: sunbird-dist-crazy
          path: dist/
          retention-days: 14
