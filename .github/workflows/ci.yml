name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck (social backend)
        run: pnpm typecheck:server

      - name: Test
        run: pnpm test

      - name: Test (social backend)
        run: pnpm test:server

      - name: Build (Vercel / direct / PWA)
        env:
          VITE_PORTAL_TARGET: none
        run: pnpm build:vercel

      - name: Upload dist artifact (Vercel)
        uses: actions/upload-artifact@v4
        with:
          name: sunbird-dist-vercel
          path: dist/
          retention-days: 14

  verify-prod:
    name: Production gate (audit + budget + determinism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Autoperfect production mode
        run: pnpm verify:prod

  build-itch:
    name: Build (itch.io single-file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (itch.io singlefile)
        env:
          VITE_PORTAL_TARGET: none
          VITE_SINGLEFILE: "true"
        run: pnpm build:itch
      - uses: actions/upload-artifact@v4
        with:
          name: sunbird-dist-itch
          path: dist-itch/
          retention-days: 14

  artifact:
    name: Artifact (Inspector folder in a real browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the Poki artifact
        run: pnpm build:poki
      - name: Verify the upload shape
        run: pnpm verify:upload
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Load the shipping folder in a real browser
        run: pnpm test:artifact -- --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
      - name: Upload the failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: poki-artifact-failure
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  portals:
    name: Build (Poki + CrazyGames + generic zips)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all portal zips
        run: pnpm build:portals
      - name: Verify the Poki Inspector upload shape
        run: pnpm verify:upload
      - uses: actions/upload-artifact@v4
        with:
          name: sunbird-portal-zips
          path: |
            sunbird-poki.zip
            sunbird-crazy.zip
            sunbird-generic.zip
            poki-upload/
          retention-days: 14
