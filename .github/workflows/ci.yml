name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck (social backend)
        run: pnpm typecheck:server

      - name: Test
        run: pnpm test

      - name: Test (social backend)
        run: pnpm test:server

      - name: Build (Vercel / direct / PWA)
        env:
          VITE_PORTAL_TARGET: none
        run: pnpm build:vercel

      - name: Upload dist artifact (Vercel)
        uses: actions/upload-artifact@v4
        with:
          name: sunbird-dist-vercel
          path: dist/
          retention-days: 14

  verify-prod:
    name: Production gate (audit + budget + determinism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Autoperfect production mode
        run: pnpm verify:prod

  build-itch:
    name: Build (itch.io single-file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (itch.io singlefile)
        env:
          VITE_PORTAL_TARGET: none
          VITE_SINGLEFILE: "true"
        run: pnpm build:itch
      - uses: actions/upload-artifact@v4
        with:
          name: sunbird-dist-itch
          path: dist-itch/
          retention-days: 14

  artifact:
    name: Artifact (Inspector folder in a real browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the Poki artifact
        run: pnpm build:poki
      - name: Verify the upload shape
        run: pnpm verify:upload
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Load the shipping folder in a real browser
        shell: bash
        run: |
          set -o pipefail
          {
            echo "node: $(node -v)"
            echo "playwright: $(npx playwright --version)"
            echo "browser cache:"; ls -1 "${HOME}/.cache/ms-playwright" 2>/dev/null || true
            echo "artifact: $(stat -c '%s bytes' poki-upload/index.html 2>/dev/null || echo MISSING)"
            npx playwright test -c playwright.artifact.config.ts --reporter=list,json
          } 2>&1 | tee poki-artifact-test.log
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
      # The run's own log is the evidence for a browser test; keep it either
      # way (GitHub's log API cannot be relied on for this job).
      - name: Upload the artifact test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poki-artifact-test
          path: |
            poki-artifact-test.log
            test-results/
          retention-days: 7
          if-no-files-found: warn

  portals:
    name: Build (Poki + CrazyGames + generic zips)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all portal zips
        run: pnpm build:portals
      - name: Verify the Poki Inspector upload shape
        run: pnpm verify:upload
      - uses: actions/upload-artifact@v4
        with:
          name: sunbird-portal-zips
          path: |
            sunbird-poki.zip
            sunbird-crazy.zip
            sunbird-generic.zip
            poki-upload/
          retention-days: 14
