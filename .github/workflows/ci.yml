name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (Vercel / direct / PWA)
        env:
          VITE_PORTAL_TARGET: none
        run: npm run build:vercel

      - name: Upload dist artifact (Vercel)
        uses: actions/upload-artifact@v4
        with:
          name: sunbird-dist-vercel
          path: dist/
          retention-days: 14

  backend:
    name: Backend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: backend
      - run: npx tsc --noEmit
        working-directory: backend

  build-itch:
    name: Build (itch.io single-file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (itch.io singlefile)
        env:
          VITE_PORTAL_TARGET: none
          VITE_SINGLEFILE: "true"
        run: npm run build:itch
      - uses: actions/upload-artifact@v4
        with:
          name: sunbird-dist-itch
          path: dist-itch/
          retention-days: 14

  portals:
    name: Build (Poki + CrazyGames + generic zips)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build all portal zips
        run: npm run build:portals
      - uses: actions/upload-artifact@v4
        with:
          name: sunbird-portal-zips
          path: |
            sunbird-poki.zip
            sunbird-crazy.zip
            sunbird-generic.zip
          retention-days: 14
