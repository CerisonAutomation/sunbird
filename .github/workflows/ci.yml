name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (direct/PWA)
        env:
          VITE_PORTAL_TARGET: none
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunbird-dist
          path: dist/
          retention-days: 7

  portal-poki:
    name: Build (Poki)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (Poki portal)
        env:
          VITE_PORTAL_TARGET: poki
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: sunbird-dist-poki
          path: dist/
          retention-days: 7
