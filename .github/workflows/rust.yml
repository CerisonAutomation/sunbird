name: rust-backend

on:
  push:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --all
      - name: Commit formatting
        # Apply rustfmt canonically and push the result back so the check
        # below (and every future run) is against rustfmt's exact output.
        # The follow-up run triggered by this push sees no diff and is a
        # no-op, so this converges instead of looping.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: apply cargo fmt"
            git push
          fi
      - name: Format (check)
        run: cargo fmt --all --check
      - name: Clippy
        id: clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 \
            | tee /tmp/clippy.log
      # The Actions log bundle is not always retrievable (the results-receiver
      # host is unreachable from some sandboxes), so diagnostics are also
      # published as check annotations, which come back over api.github.com.
      - name: Publish clippy diagnostics as annotations
        if: failure() && steps.clippy.outcome == 'failure'
        run: |
          grep -E '^[^[:space:]].*: (error|warning)' /tmp/clippy.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      - name: Test
        id: test
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee /tmp/test.log
      - name: Publish test failures as annotations
        if: failure() && steps.test.outcome == 'failure'
        run: |
          grep -E "^(error|test result: FAILED|failures:|---- .* stdout ----)|panicked at" /tmp/test.log \
            | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      - name: Release build
        run: cargo build --workspace --release
      - uses: actions/upload-artifact@v4
        with:
          name: sunbird-server
          path: rust/target/release/sunbird-server
