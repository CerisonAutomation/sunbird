name: rust-backend

on:
  push:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --all
      - name: Commit formatting
        # Apply rustfmt canonically and push the result back so the check
        # below (and every future run) is against rustfmt's exact output.
        # The follow-up run triggered by this push sees no diff and is a
        # no-op, so this converges instead of looping.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: apply cargo fmt"
            git push
          fi
      - name: Format (check)
        run: cargo fmt --all --check
      - name: Clippy
        id: clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 \
            | tee /tmp/clippy.log
      # The Actions log bundle is not always retrievable (the results-receiver
      # host is unreachable from some sandboxes), so diagnostics are also
      # published as check annotations, which come back over api.github.com.
      - name: Publish clippy diagnostics
        if: failure() && steps.clippy.outcome == 'failure'
        run: |
          # Cargo-level failures (dependency resolution, manifest problems) print
          # as a bare `error: ...` with no file path, which a path-shaped grep
          # silently misses -- that is how the first attempt at this step
          # "succeeded" while reporting nothing.
          grep -E '(^|: )(error|warning)(\[|:)' /tmp/clippy.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          {
            echo '### Clippy output'
            echo '```'
            tail -n 100 /tmp/clippy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Post clippy log to the PR
        if: failure() && steps.clippy.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### `cargo clippy` output (job '"$GITHUB_RUN_ID"')'
            echo '```'
            tail -n 120 /tmp/clippy.log
            echo '```'
          } > /tmp/clippy-body.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/clippy-body.md
      - name: Test
        id: test
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee /tmp/test.log
      - name: Publish test failures as annotations
        if: failure() && steps.test.outcome == 'failure'
        run: |
          # -A3 after "panicked at" because the assertion message -- the only
          # part that says WHICH case failed -- is on the following lines, and
          # a bare grep of the header line tells you nothing.
          grep -A3 "panicked at" /tmp/test.log | head -40 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line}"
          done
          {
            echo '### cargo test output'
            echo '```'
            tail -n 120 /tmp/test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Post test log to the PR
        if: failure() && steps.test.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### `cargo test` output (job '"$GITHUB_RUN_ID"')'
            echo '```'
            grep -B2 -A6 "panicked at" /tmp/test.log | tail -n 120
            echo '```'
          } > /tmp/test-body.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/test-body.md
      - name: Release build
        run: cargo build --workspace --release
      - uses: actions/upload-artifact@v4
        with:
          name: sunbird-server
          path: rust/target/release/sunbird-server
