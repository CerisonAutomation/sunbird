                                          - generic: "ROLE You are a principal product engineer, staff designer, and growth-minded mobile app architect. Build a production-ready, fully deployable MVP+ of a mobile-first gay dating and social app called NEXUS: “Find Your King”, inspired by the strongest practical patterns from modern queer social apps while remaining an original product with its own identity. Infer all missing decisions yourself and act. Do not stop to ask clarifying questions unless a decision is irreversible. No placeholders, no TODOs, no fake integrations, no mocked features presented as complete. PRIMARY GOAL Create a working, polished, end-to-end application that feels competitive with products like Grindr, ROMEO, and MACHOBB in the areas of discovery, filtering, privacy, travel, profile richness, matching, messaging, media sharing, events, moderation, and niche community support. STACK - Next.js latest stable App Router - TypeScript strict mode - Tailwind CSS + dark/light themes - SQLite for local/dev and easy self-hosting - Prisma-compatible data layer; if Prisma engine download/runtime fails, fall back automatically to a production-grade repository/service abstraction with better-sqlite3 without reducing functionality - NextAuth or hardened cookie-session auth; choose the lowest-friction local-first option that works - Zod validation everywhere - React Hook Form for forms - Server Actions or REST routes where most appropriate - PWA installable - Dockerfile + docker-compose for one-command local deployment - Health endpoint, structured logging, rate limiting, audit logs for moderation/admin actions PRODUCT POSITIONING NEXUS is not just a swipe app. It is a queer social discovery platform for dating, chats, nearby people, planned meetups, travel connections, and community-based matching. The tone should be premium, masculine, modern, dark-mode-first, but safe and respectful. It should support both broad discovery and niche identity/intimacy preferences without shaming language. TARGET UX - Mobile-first, thumb-friendly, polished like a real shipped product - Native-app feel with bottom nav, sheets, drawers, segmented controls, fast transitions - Works beautifully on desktop too - Distinctive branding and product identity, not a clone INFORMATION ARCHITECTURE Implement these main tabs / areas: 1. Home / Nearby 2. Explore / Travel 3. Likes / Visitors / Matches 4. Chats 5. Events / Plans 6. Profile / Settings 7. Admin / Moderation (protected) CORE FEATURES TO IMPLEMENT END-TO-END A. AUTH + ACCOUNT - Email/password sign-up and login - Password reset flow - Change password with current password verification - Session management - Optional onboarding wizard after first sign-in - Age gate (18+) - Terms/privacy consent checkboxes - Device/session list with sign-out-other-sessions B. PROFILE SYSTEM - Rich profile with: - display name - age / DOB with age shown, DOB hidden - bio / headline - height, weight, body type - ethnicity - gender expression / pronouns - relationship intent / looking for - tribe / community tags - position / role preference (optional, user-controlled) - interests / kinks / lifestyle tags as opt-in structured tags - city / area - verification badges state - online / recently active state with privacy controls - Multiple photos with: - public and private photos - reorder photos - set primary avatar - delete / replace - blurred-lock state for private albums - request private album access - approve / deny private album access - Profile completion score - Editable preferences and deal-breakers - Fake/demo verification pipeline UI with honest “manual review/local mode” wording unless fully automated C. DISCOVERY - Nearby grid sorted by distance / activity / compatibility - Cascade/card mode and compact grid mode - Advanced filters: - age range - distance radius - online now / recently active - looking for - tribe/community tags - body type - ethnicity - height / weight ranges - photo only - verified only - has private album - travel mode only - hosting / available to meet - Saved filter presets - Explore page for other cities - Travel mode: - set destination city - arrival window - visible in destination before travel date - switch back to local mode - Optional map view for nearby users and events - Respect privacy settings when showing distance and visibility D. SOCIAL SIGNALS - Like / tap / woof-style lightweight interest signal - Mutual like creates a match - Visitors / profile views log - Footprint controls: - show my visit - browse invisibly - hide visitors from others if invisible mode is on - Favorites / saved profiles - Notes on profiles (private to self) E. CHAT + MEDIA - 1:1 chat - Send text, emojis, and photos - Read states - Typing indicator via polling/websocket if feasible locally - Unread counts - Reply to message - Edit sent message - Unsend message - Delete for self - Optional disappearing photos/messages with expiry timer - Message templates / quick openers - Built-in message translation using local model - Safety warnings before sharing exact location or sensitive data - Media permissions and private album requests inside chat F. EVENTS + PLANS - Create local events and casual plans - Event proposals extracted from chat intent - Plan cards with date/time/place/intention - Mutual acceptance flow before confirming a meetup - RSVP states - Small map preview - Host / attendee list with privacy rules - Report event / cancel event / leave event G. LOCAL AI FEATURES ONLY No paid APIs, no cloud LLM dependencies, no required API keys. Use local/server-side open-source models with lazy loading and fallbacks. - Chat translation endpoint - Intent classifier for greetings, flirting, plan-making, explicit photo request, safety-risk cue - Smart reply chips based on conversation + user habits - Profile bio assistant that can rewrite tone locally - Safety assistant that detects risky patterns and suggests safer actions - Event extraction from conversation into structured proposal - Keep total model footprint practical for local self-hosting; document model sizes and fallbacks H. SAFETY + PRIVACY - Block user - Report user - Mute conversation - Hide distance - Approximate distance mode - Hide online status / appear offline - Incognito browsing mode - Screenshot warning UI for sensitive media - Sensitive-content blur toggle - App lock with PIN for local session re-entry if practical - Safety mode for travel / high-risk region behavior - Strong privacy wording: never imply absolute safety - Full consent-driven media/private album flows - Moderation queues for reports - Audit log of moderation actions I. NICHE COMMUNITY SUPPORT Make this product broad but capable of serving sub-communities better than generic apps. - Structured tags for communities / tribes - Opt-in explicitness controls - Profile visibility based on compatibility preferences - Content gating for explicit/sensitive media - Respectful terminology and toggleable exposure level - No stigmatizing copy J. PREMIUM-READY PRODUCT ARCHITECTURE Even if subscriptions are not fully wired to Stripe yet, architect feature gating cleanly. Implement a local feature-flag / plan system with Free and Plus tiers: Free examples: - basic filters - limited visitors history - limited favorites - standard travel preview Plus examples: - advanced filters - unlimited saved profiles - invisible browsing - extended visitors history - travel mode lead time - read receipts - message translation - disappearing media controls Do not fake billing completion. If payment is not integrated, provide a clean stubbed plan-management architecture and honest local/dev PLEASE MAKE THIS INTO FYK 10000000x BETTER CIOMPLETE PROMPT ALL INC"
