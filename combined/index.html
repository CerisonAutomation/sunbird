<style>
:root {
  --ink: #1a1510;
  --paper: #fff9f0;
  --paper2: #fff0d8;
  --accent: #ff6b4a;
  --gold: #ffc14d;
  --bad: #d6453b;
  --blue: #4a90e8;
  --green: #42b862;
  --mid: #888;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #f0e8d8;
    --paper: #1a1510;
    --paper2: #221c15;
    --mid: #aaa;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #f0e8d8;
  --paper: #1a1510;
  --paper2: #221c15;
  --mid: #aaa;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; user-select: none; }
body { background: var(--paper); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }

#canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

/* Speed-feel overlays */
#vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 3;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
  opacity: 0; transition: opacity 0.05s;
}
#streaks {
  position: fixed; inset: 0; pointer-events: none; z-index: 3;
  background: repeating-linear-gradient(90deg, transparent 0, transparent 48%, rgba(255,255,255,0.03) 49%, rgba(255,255,255,0.03) 51%, transparent 52%);

}
#altimeter {
  position: fixed; right: 16px; top: calc(env(safe-area-inset-top,0px) + 16px);
  z-index: 10; display: flex; flex-direction: column; align-items: flex-end; gap: 3px;

}
#alt-bar-wrap { width: 6px; height: 64px; background: rgba(0,0,0,0.2); border-radius: 3px; overflow: hidden; }

/* HUD */
#hud {
  position: fixed; inset: 0; pointer-events: none; z-index: 10;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
#hud-top {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 12px 16px 0;
}
#score-box { display: flex; flex-direction: column; gap: 2px; }
#score { font-size: 32px; font-weight: 800; letter-spacing: -1px; line-height: 1; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
#best-line { font-size: 11px; color: rgba(255,255,255,0.7); font-weight: 600; }
#combo-badge {
  font-size: 13px; font-weight: 800; color: var(--gold);
  text-shadow: 0 1px 6px rgba(0,0,0,0.6); opacity: 0;
  transition: opacity 0.2s; letter-spacing: 0.5px;
}
#daylight-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
#daylight-bar-bg {
  width: 120px; height: 8px; background: rgba(0,0,0,0.3);
  border-radius: 4px; overflow: hidden;
}
#daylight-bar {
  height: 100%; width: 100%;
  background: linear-gradient(90deg, #ff9530 0%, #ffe030 50%, #fff080 100%);
  border-radius: 4px; transition: width 0.2s;
}
#daylight-label { font-size: 10px; color: rgba(255,255,255,0.8); font-weight: 700; letter-spacing: 0.3px; }
#coins-row { display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255,255,255,0.9); font-weight: 700; }
#coins-icon { font-size: 14px; }

#feedback {
  position: fixed; left: 50%; top: 30%;
  transform: translate(-50%,-50%);
  font-size: 22px; font-weight: 900; letter-spacing: 0.5px;
  color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  pointer-events: none; z-index: 20;
  opacity: 0; transition: opacity 0.15s;
}

#boost-indicator {
  position: fixed; bottom: calc(env(safe-area-inset-bottom,0px) + 80px);
  left: 50%; transform: translateX(-50%);
  z-index: 10; pointer-events: none;
  display: flex; gap: 6px;
}
.boost-pip {
  width: 10px; height: 10px; border-radius: 50%;
  background: rgba(255,255,255,0.25);
  transition: background 0.2s;
}
.boost-pip.ready { background: var(--gold); box-shadow: 0 0 8px var(--gold); }

#biome-name {
  position: fixed; left: 50%; top: 52px;
  transform: translateX(-50%);

  text-transform: uppercase; color: rgba(255,255,255,0.6);
  pointer-events: none; z-index: 10;
}

/* Screens */

<!-- Bootstrap: Safe Store + Crash Journal + Poki SDK gate -->
<script>
(function(){
  'use strict';
  const PREFIX = 'poki_ignore.';
  const mem = {};
  const Store = window.Store = {
    get(k, d=null) {
      try { const v = localStorage.getItem(PREFIX+k); return v==null?d:JSON.parse(v); }
      catch { return mem[k]??d; }
    },
    set(k, v) {
      try { localStorage.setItem(PREFIX+k, JSON.stringify(v)); }
      catch {}
      mem[k] = v;
    },
    remove(k) {
      try { localStorage.removeItem(PREFIX+k); } catch {}
      delete mem[k];
    }
  };

  // Crash Journal
  const CJ_KEY = 'crash_journal';
  const CJ_MAX = 5;
  const _fp = {};
  const CJ = window.CrashJournal = {
    log(err) {
      try {
        const msg = (err?.message||String(err)).replace(/https?:\/\/\S+/g,'[url]').slice(0,200);
        const key = msg.slice(0,60);
        const now = Date.now();
        if (_fp[key] && now - _fp[key] < 30000) return;
        _fp[key] = now;
        const entries = Store.get(CJ_KEY, []);
        entries.unshift({ ts: now, msg, stack: (err?.stack||'').slice(0,300).replace(/https?:\/\/\S+/g,'[url]') });
        Store.set(CJ_KEY, entries.slice(0, CJ_MAX));
      } catch {}
    },
    get() { return Store.get(CJ_KEY, []); }
  };
  window.addEventListener('error', e => CJ.log(e.error||e.message));
  window.addEventListener('unhandledrejection', e => CJ.log(e.reason));

  // Poki SDK
  const P = window.Poki = {
    _ready: false, _resolvers: [],
    ready(fn) { this._ready ? fn() : this._resolvers.push(fn); },
    _resolve() { this._ready=true; this._resolvers.forEach(f=>f()); this._resolvers=[]; },
    gameplayStart() { try { PokiSDK?.gameplayStart(); } catch{} },
    gameplayStop() { try { PokiSDK?.gameplayStop(); } catch{} },
    happyTime(f=1) { try { PokiSDK?.happyTime(f); } catch{} },
    commercialBreak() { return new Promise(r => { try { (PokiSDK?.commercialBreak()||Promise.resolve()).then(r).catch(r); } catch{r();} }); },
    rewardedBreak() { return new Promise(r => { try { (PokiSDK?.rewardedBreak?.()||Promise.resolve()).then(b=>r(!!b)).catch(()=>r(false)); } catch{r(false);} }); }
  };
  if (typeof PokiSDK !== 'undefined') {
    PokiSDK.init().then(()=>P._resolve()).catch(()=>P._resolve());
  } else {
    P._resolve();
  }
})();
</script>

// ─── RNG ──────────────────────────────────────────────────────────────────────
function mulberry32(s) {
  return function() {
    s|=0; s=s+0x6D2B79F5|0;
    let t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

// ─── Terrain height ───────────────────────────────────────────────────────────
let _biome = BIOMES[0];
function hillY(x, amp=_biome.amp, wave=_biome.wave) {
  const base = amp * (
    14 * Math.sin(x * 0.0220 * wave) +
    8  * Math.sin(x * 0.0470 * wave + 1.3) +
    5  * Math.sin(x * 0.0910 * wave + 2.7) +
    3  * Math.sin(x * 0.1730 * wave + 0.8)
  );
  // Island blending
  const iOff = x % ISL;
  const iFrac = iOff / ISL;
  if (iOff < 0 || iFrac > (GAP_START/ISL)) {
    // ocean gap
    const gapFrac = Math.max(0, (iOff - GAP_START) / (ISL - GAP_START));
    const blend = Math.max(0, Math.min(1, gapFrac * 3));
    return base * (1-blend) + OCEAN_FLOOR * blend;
  }
  if (iFrac < (DROP_START/ISL) * 0.6) {
    // entry ramp
    const t = Math.min(1, iOff / (DROP_START * 0.5));
    return base * (0.3 + 0.7 * t);
  }
  return base;
}
function slopeAt(x) { return (hillY(x+0.5)-hillY(x-0.5)); }

// ─── SpeedFeel ────────────────────────────────────────────────────────────────
const CRUISE=0.40, RUSH=0.65, WARP=0.82;
function warpT(norm) {
  if (!isFinite(norm)) return 0;
  return Math.max(0,Math.min(1,(norm-CRUISE)/(WARP-CRUISE)));
}
function glideLiftScale(airSecs) {
  if (airSecs < 2.5) return 1;
  const t = Math.max(0, Math.min(1, (airSecs-2.5)/4.0));
  return 1*(1-t)+0.32*t;
}

function makeChunkMesh(cx) {
  const segs = Math.ceil(CELL/CELL_RES);
  const geo = new THREE.PlaneGeometry(CELL, TZ*2, segs, 1);
  geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position;
  const col = new Float32Array(pos.count*3);
  for (let i=0;i<pos.count;i++) {
    const x = pos.getX(i)+cx*CELL;
    const y = hillY(x);
    pos.setY(i, y);
    // colour by height & biome
    const norm = Math.max(0,Math.min(1,(y+5)/28));
    const c = new THREE.Color(norm<0.35?_biome.mid:norm<0.65?_biome.ridge:_biome.top);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({ vertexColors:true });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData.cx = cx;
  return mesh;
}

let chunkPool = [];
let leadChunk = 0;
function initTerrain() {
  terrainGroup.clear();
  chunkPool = [];
  for (let i=-CHUNKS_BACK; i<=CHUNKS_FWD; i++) {
    const m = makeChunkMesh(i);
    terrainGroup.add(m);
    chunkPool.push(m);
    leadChunk = Math.max(leadChunk, i);
  }
}

function updateTerrain(camX) {
  const camCX = Math.floor(camX/CELL);
  for (const m of chunkPool) {
    const cx = m.userData.cx;
    if (cx < camCX - CHUNKS_BACK) {
      // recycle to front
      const newCX = cx + CHUNKS_TOTAL;
      m.userData.cx = newCX;
      m.position.x = 0;
      // rebuild verts
      const pos = m.geometry.attributes.position;
      const col = m.geometry.attributes.color;
      const segs = Math.ceil(CELL/CELL_RES);
      for (let i=0;i<pos.count;i++) {
        const lx = pos.getX(i);
        const x = lx + newCX*CELL;
        const y = hillY(x);
        pos.setY(i,y);
        const norm = Math.max(0,Math.min(1,(y+5)/28));
        const c = new THREE.Color(norm<0.35?_biome.mid:norm<0.65?_biome.ridge:_biome.top);
        col.setXYZ(i,c.r,c.g,c.b);
      }
      pos.needsUpdate = true;
      col.needsUpdate = true;
      m.geometry.computeVertexNormals();
    }
  }
}

const trailNodes = Array.from({length:TN},()=>new THREE.Vector3());
function pushTrail(x,y,z,fever,boost) {
  for (let i=TN-1;i>0;i--) trailNodes[i].copy(trailNodes[i-1]);
  trailNodes[0].set(x,y,z);
  for (let i=0;i<TN;i++) {
    trailPositions[i*3]=trailNodes[i].x;

const ptPos = new Float32Array(PN*3);
const ptCol = new Float32Array(PN*3);
const ptGeo = new THREE.BufferGeometry();
ptGeo.setAttribute('position',new THREE.BufferAttribute(ptPos,3));
ptGeo.setAttribute('color',new THREE.BufferAttribute(ptCol,3));

const ptVel = Array.from({length:PN},()=>({x:0,y:0,z:0,life:0,maxLife:1}));

function spawnParticle(x,y,z,vx,vy,r,g,b) {
  let idx = -1;
  for (let i=0;i<PN;i++) if (ptVel[i].life<=0){idx=i;break;}
  if (idx<0) idx=Math.floor(Math.random()*PN);
  const p = ptVel[idx];
  p.x=x; p.y=y; p.z=z; p.vx=vx+(Math.random()-0.5)*3; p.vy=vy+(Math.random()-0.5)*3;
  p.vz=(Math.random()-0.5)*3; p.life=p.maxLife=0.5+Math.random()*0.5;
  ptPos[idx*3]=x; ptPos[idx*3+1]=y; ptPos[idx*3+2]=z;
  ptCol[idx*3]=r; ptCol[idx*3+1]=g; ptCol[idx*3+2]=b;
}

function updateParticles(dt) {
  for (let i=0;i<PN;i++) {
    const p = ptVel[i];
    if (p.life<=0) { ptPos[i*3+1]=-9999; continue; }
    p.life -= dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt; p.vy-=8*dt;
    ptPos[i*3]=p.x; ptPos[i*3+1]=p.y; ptPos[i*3+2]=p.z;
    const a = p.life/p.maxLife;
    ptCol[i*3]*=1; ptCol[i*3+1]*=1; ptCol[i*3+2]*=1;
    // fade alpha via color dim
    ptCol[i*3]=ptCol[i*3]*a; ptCol[i*3+1]=ptCol[i*3+1]*a; ptCol[i*3+2]=ptCol[i*3+2]*a;
  }
  ptGeo.attributes.position.needsUpdate=true;
  ptGeo.attributes.color.needsUpdate=true;
}

// ─── Audio ────────────────────────────────────────────────────────────────────
let _actx = null;
function ac() {
  if (!_actx) { try { _actx = new (window.AudioContext||window.webkitAudioContext)(); } catch{} }
  return _actx;
}
function resumeAC() { try { ac()?.resume(); } catch{} }

let _musicChordIdx = 0, _musicTime = 0, _musicSched = 0;
const _musicGain = { node: null };
function ensureMusicGain() {
  const a = ac(); if (!a) return null;
  if (!_musicGain.node) { _musicGain.node = a.createGain(); _musicGain.node.gain.value=0.2; _musicGain.node.connect(a.destination); }
  return _musicGain.node;
}
function playNote(freq, start, dur, gain=0.12, type='sine') {
  const a = ac(); if (!a) return;
  const mg = ensureMusicGain(); if (!mg) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,start);
  g.gain.linearRampToValueAtTime(gain,start+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,start+dur);
  o.connect(g); g.connect(mg);
  o.start(start); o.stop(start+dur+0.05);
}
function scheduleMusic(t) {
  const a = ac(); if (!a) return;
  const now = a.currentTime;
  while (_musicSched < now + 2.0) {
    const chord = CHORDS[_musicChordIdx % CHORDS.length];
    const step = _musicSched;
    const beat = 0.4;
    // Arpeggio
    chord.forEach((f,i) => playNote(f, step+i*beat*0.25, beat*0.6, 0.06));
    // Bass
    playNote(chord[0]/2, step, beat*1.5, 0.08, 'triangle');
    // Melody note
    const mel = MELODIES[_musicChordIdx%MELODIES.length];
    if (mel) {
      const noteIdx = Math.floor((_musicSched - _musicTime) / beat * 2) % mel.length;
      const semi = mel[noteIdx]||0;
      if (semi>0) {
        const baseFreq = chord[0];
        playNote(baseFreq * Math.pow(2, semi/12), step+beat*0.5, beat*0.4, 0.05, 'sine');
      }
    }
    _musicSched += beat * chord.length * 0.5;
    _musicChordIdx++;
  }
}
function playSfx(freq, dur, type='square', vol=0.1) {
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  const now = a.currentTime;
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(vol,now);
  g.gain.exponentialRampToValueAtTime(0.001,now+dur);
  o.connect(g); g.connect(a.destination);
  o.start(now); o.stop(now+dur+0.05);
}
function playLandSfx(quality) {
  if (quality==='perfect') { playSfx(880,0.15,'sine',0.08); playSfx(1320,0.1,'sine',0.05); }
  else if (quality==='good') { playSfx(660,0.12,'sine',0.06); }
  else { playSfx(200,0.2,'sawtooth',0.08); }
}
function playLaunchSfx(rating) {
  if (rating==='perfect') { playSfx(1046,0.2,'sine',0.1); playSfx(1318,0.15,'sine',0.08); }
  else if (rating==='great') { playSfx(880,0.15,'sine',0.08); }
  else { playSfx(660,0.1,'sine',0.06); }
}

function onDown(e) {
  e.preventDefault();
  resumeAC();
  if (state==='menu'||state==='boot') return;
  if (state==='over'||state==='revive') return;
  if (state==='pause') return;
  if (state!=='play') return;
  const now = performance.now();
  if (now-lastTap < 300 && !held) {
    // double-tap = manual boost
    if (manualBoostCD<=0 && !fever) {
      manualBoostT = MANUAL_BOOST_TIME;
      manualBoostCD = MANUAL_BOOST_CD;
      playSfx(880,0.2,'sawtooth',0.1);
    }
    lastTap=0;
  } else {
    lastTap=now;
  }
  held=true;
  justTapped=true;
  // launch arm
  if (onGround) { launchArmed=true; launchT=0; launchStartVX=bvx; }
}
function onUp(e) {
  e.preventDefault();
  if (!held) return;
  held=false;
  if (state==='play' && launchArmed && onGround) {
    // rate launch quality
    const frac = Math.min(1,(bvx - launchStartVX)/(VMAX*0.5));
    let rating='normal';
    if (frac>=RATING_PERFECT) rating='perfect';
    else if (frac>=RATING_GREAT) rating='great';
    else if (frac>=RATING_GOOD) rating='good';
    applyLaunchRating(rating);
    launchArmed=false;
  }
}
function applyLaunchRating(r) {
  const mult = r==='perfect'?BOOST_PERFECT:r==='great'?BOOST_GREAT:r==='good'?BOOST_GOOD:1.0;
  if (mult>1) { bvx*=mult; showFeedback(r==='perfect'?'✨ PERFECT!':r==='great'?'⚡ GREAT!':'👍 GOOD!',r==='perfect'?'#ffd700':r==='great'?'#88ff88':'#aaaaff'); }
  playLaunchSfx(r);
  combo++;
  comboT = 4;
  if (combo>2) showCombo();
  if (combo > save.maxCombo) { save.maxCombo=combo; }
}

// ─── Physics update ───────────────────────────────────────────────────────────
let _acc = 0;
function physicsStep() {
  const gndY = hillY(bx);
  const onGndNow = by <= gndY + R + 0.15;

  // Landing detection
  if (!prevOnGround && onGndNow && bvy<0) {
    const slope = slopeAt(bx);
    const nLen = Math.sqrt(slope*slope+1);
    const vLen = Math.sqrt(bvx*bvx+bvy*bvy);
    if (vLen>0) {
      const dot = Math.abs((-bvy+bvx*slope) / (vLen*nLen));
      const align = dot;
      let quality='bad', keep=LAND_BAD_MIN;
      if (align>=LAND_PERFECT) { quality='perfect'; keep=LAND_GOOD_KEEP; perfectLandsRun++; }
      else if (align>=LAND_GOOD) { quality='good'; keep=LAND_GOOD_KEEP; }
      if (quality!=='bad') {
        feverMeter++;
        if (feverMeter>=FEVER_NEED && !fever) triggerFever();
      }
      bvx*=keep; bvy=0;
      onLanding(quality);
    }
  }
  prevOnGround=onGndNow;
  onGround=onGndNow;

  if (onGround) {
    airSecs=0;
    by=gndY+R;
    const slope=slopeAt(bx);
    const norm=1/Math.sqrt(slope*slope+1);
    // Sunflower trampoline check
    const onSunflower = (bx%180>175||bx%240>235) && _biome.id==='green';
    if (onSunflower && bvy>=-1) {
      bvy=SUNFLOWER_VY; bvx+=SUNFLOWER_VX;
      showFeedback('🌻 BOING!','#ffee44');
      playSfx(660,0.3,'sine',0.12);
    } else {
      const gG = held ? G_GROUND_DIVE : G_GROUND;
      bvx -= gG*slope*norm*STEP;
      const fr = held ? 0.008 : GROUND_FRICTION;
      bvx *= (1-fr);
      bvy=slope*bvx;
    }
  } else {
    airSecs += STEP;
    const liftScale = glideLiftScale(airSecs);
    const grav = held ? G_DIVE : G;
    const drag = held ? DRAG_DIVE : DRAG_GLIDE;
    const spd = Math.sqrt(bvx*bvx+bvy*bvy);
    // lift (only when gliding, not held)
    let lift=0;
    if (!held) {
      lift = Math.min(G*LIFT_MAX, G*LIFT_MAX*(spd/LIFT_SPEED)*(spd/LIFT_SPEED)) * liftScale;
    }
    // stick force
    const stick = held ? STICK_DIVE : STICK_GLIDE;
    const gndY2=hillY(bx);
    const dist2gnd = by - gndY2;
    const stickyF = held && dist2gnd < 4 ? stick : 0;
    bvy -= (grav - lift + stickyF) * STEP;
    bvx -= drag * bvx * Math.abs(bvx) * STEP;
    bvy -= drag * bvy * Math.abs(bvy) * STEP;
  }

  // Thermals
  for (const t of thermalPool) {
    if (!t.active) continue;
    const dx=bx-t.x, dy=by-t.y;
    if (Math.abs(dx)<3 && Math.abs(dy)<15) {
      bvy += t.str * 4 * STEP;
      if (!t._triggered) {
        t._triggered=true; thermalsThisRun++;
        showFeedback('🌀 THERMAL!','#88ffcc');
        playSfx(440,0.4,'sine',0.07);
        for(let i=0;i<8;i++) spawnParticle(bx,by,0,0,5+_rng()*3,0.2,1,0.6);
        document.getElementById('thermal-ring').style.opacity='1';
        setTimeout(()=>document.getElementById('thermal-ring').style.opacity='0',800);
      }
    } else t._triggered=false;
    if (bx-t.x > 20) { t.active=false; t.mesh.visible=false; }
  }

  // Manual boost
  if (manualBoostT>0) {
    manualBoostT-=STEP;
    bvx = Math.max(bvx, MANUAL_BOOST_SPEED);
  }
  if (manualBoostCD>0) manualBoostCD-=STEP;

  // Zenith slow-mo (when very high)
  const altAboveTerrain = by - hillY(bx);
  if (altAboveTerrain > ZENITH_ALT && !zenithAchieved) {
    zenithAchieved=true;
    save.zenithCount=(save.zenithCount||0)+1;
    showFeedback('🌤 ZENITH!','#ffee44');
    playSfx(1320,0.5,'sine',0.1);
    for(let i=0;i<12;i++) spawnParticle(bx,by,0,(Math.random()-0.5)*8,(Math.random()-0.5)*8,1,0.9,0.4);
  }

  // Fever
  if (fever) {
    feverT -= STEP;
    if (feverT<=0) { fever=false; feverMeter=0; }
    bvx = Math.min(bvx*1.002, VMAX_FEVER);
  }

  // Speed cap
  const vmax = fever?VMAX_FEVER:VMAX;
  const tailwind = 1+(upgLevel('tw')*0.04);
  bvx = Math.max(4, Math.min(vmax*tailwind, bvx));

  // Advance x
  bx += bvx*STEP;
  by += bvy*STEP;

  // Terrain collision safety
  const gy2=hillY(bx);
  if (by<gy2+R) { by=gy2+R; if(bvy<0)bvy=0; }
}

function onLanding(quality) {
  playLandSfx(quality);
  if (quality==='perfect') {
    showFeedback('🪶 PERFECT LAND!','#ffd700');
    for(let i=0;i<6;i++) spawnParticle(bx,by,0,(Math.random()-0.5)*4,4+Math.random()*2,1,0.9,0.4);
  } else if (quality==='good') {
    for(let i=0;i<3;i++) spawnParticle(bx,by,0,(Math.random()-0.5)*3,3,0.6,1,0.5);
  }
}

function triggerFever() {
  fever=true; feverT=FEVER_DURATION;
  fevers++;
  save.feverCount=(save.feverCount||0)+1;
  showFeedback('🔥 FEVER!','#ff6600');
  playSfx(880,0.5,'sawtooth',0.15);
  for(let i=0;i<16;i++) spawnParticle(bx,by,0,(Math.random()-0.5)*10,5+Math.random()*5,1,0.5+Math.random()*0.5,0);
  Poki.happyTime(0.8);
}

// ─── Pickups ───────────────────────────────────────────────────────────────────
function spawnPickups() {
  if (bx>spawnX) {
    const gY=hillY(spawnX);
    // Coins scattered
    for(let i=0;i<3+_rng()*3|0;i++) spawnCoin(spawnX+i*6,gY);
    // Occasional powerup
    if (_rng()<0.12) spawnPowerup(spawnX+20,gY);
    // Ring
    if (_rng()<0.06) spawnRing(spawnX+30,gY+8);
    // Thorn (hazard)
    if (_rng()<0.08 && _biome.hazard!=='none') spawnThorn(spawnX+10,gY);
    // Thermal (per biome density)
    if (_rng()<_biome.thermals*0.015) spawnThermal(spawnX+25, gY, 1+_biome.thermals*0.1);
    spawnX+=60+_rng()*40;
  }
}

function checkPickups() {
  const mr = puActive.magnet ? MAGNET_R : MAGNET_R_NORMAL * (1+(upgLevel('cc')*0.3));
  // Coins
  for (let i=0;i<COIN_CAP;i++) {
    const c=coinData[i];
    if (!c.active) continue;
    const dx=bx-c.x, dy=by-c.y;
    if (dx*dx+dy*dy < mr*mr) {
      deactivateCoin(i);
      const mult = 1+(upgLevel('lf')*0.15)*(combo>1?Math.min(combo,5):1);
      runCoins+=COIN_VALUE*mult|0;
      score+=10;
      for(let j=0;j<2;j++) spawnParticle(c.x,c.y,c.z,(Math.random()-0.5)*3,2+Math.random()*2,1,0.85,0.1);
    }
    if (c.x<bx-80) deactivateCoin(i);
  }
  // Powerups
  for (const pu of puPool) {
    if (!pu.active) continue;
    const dx=bx-pu.x, dy=by-pu.y;
    if (dx*dx+dy*dy<4) {
      pu.active=false; pu.mesh.visible=false;
      activatePowerup(pu.type);
    }
    if (pu.x<bx-80) { pu.active=false; pu.mesh.visible=false; }
    pu.mesh.rotation.y+=0.05;
  }
  // Rings
  for (const r of ringPool) {
    if (!r.active) continue;
    const dx=bx-r.x, dy=by-r.y;
    if (Math.abs(dx)<3&&Math.abs(dy)<3) {
      r.active=false; r.mesh.visible=false;
      score+=50; daylight+=3;
      showFeedback('💍 RING +50','#ffee44');
      playSfx(1046,0.3,'sine',0.1);
    }
    if (r.x<bx-80){r.active=false;r.mesh.visible=false;}
    r.mesh.rotation.y+=0.04;
  }
  // Thorns
  for (const t of thornPool) {
    if (!t.active) continue;
    const dx=bx-t.x, dy=by-t.y;
    if (dx*dx+dy*dy<1.5&&!puActive.shield) {
      t.active=false; t.mesh.visible=false;
      bvx*=0.6; daylight-=3;
      showFeedback('🌵 OUCH!','#ff4444');
      playSfx(180,0.3,'sawtooth',0.12);
    }
    if (t.x<bx-80){t.active=false;t.mesh.visible=false;}
  }
  // Cull distant
  coinIM.instanceMatrix.needsUpdate=true;
}

function activatePowerup(type) {
  const dur = {magnet:12,shield:8,feather:12,longglide:9,goldenwings:10,boost:2,sun:6}[type]||8;
  puActive[type]=true;
  puTimers[type]=(puTimers[type]||0)+dur;
  const labels={magnet:'🧲 MAGNET',shield:'🛡 SHIELD',feather:'🪶 FEATHER',longglide:'🌬 LONG GLIDE',goldenwings:'✨ GOLDEN WINGS',boost:'⚡ BOOST',sun:'☀ SUN'};
  showFeedback(labels[type]||type.toUpperCase(),'#88ffcc');
  playSfx(660,0.3,'sine',0.1);
  if (type==='boost') { bvx+=52; }
  if (type==='goldenwings') { fever=true; feverT=Math.max(feverT,dur); }
}

function tickPowerups(dt) {
  for (const k of Object.keys(puTimers)) {
    puTimers[k]-=dt;
    if (puTimers[k]<=0) { delete puTimers[k]; delete puActive[k]; }
  }
  shieldMat.opacity = puActive.shield?0.25:0;
  magMesh.material.opacity = puActive.magnet?0.18:0;
}

// ─── Daylight ─────────────────────────────────────────────────────────────────
function tickDaylight(dt) {
  const gndY = hillY(bx);
  const onIsland = (bx%ISL < GAP_START);
  if (onIsland) {
    const refill = DAY_ISLAND + upgLevel('sb');
    daylight = Math.min(DAYLIGHT_MAX+upgLevel('sb')*3, daylight+refill*dt);
  } else {
    daylight -= DAY_OCEAN*dt;
  }
  if (daylight<=0) {
    daylight=0;
    endRun();
  }
}

// ─── Combo ────────────────────────────────────────────────────────────────────
function tickCombo(dt) {
  if (combo>0) {
    comboT-=dt;
    if (comboT<=0) combo=0;
  }
}

// ─── Main loop ────────────────────────────────────────────────────────────────
let prevTime = performance.now();
let paused=false;

function gameLoop(ts) {
  requestAnimationFrame(gameLoop);
  const now=ts, dt=Math.min((now-prevTime)/1000, 0.05);
  prevTime=now;

  if (state!=='play') {
    renderer.render(scene,camera);
    return;
  }

  // Fixed physics
  _acc+=dt;
  ghostRecT+=dt;
  let phySteps=0;
  while (_acc>=STEP && phySteps<5) { physicsStep(); _acc-=STEP; phySteps++; }

  // Game ticks
  tickDaylight(dt);
  tickCombo(dt);
  tickPowerups(dt);
  spawnPickups();
  checkPickups();
  updateParticles(dt);

  // Distance & score
  distance = bx|0;
  score = distance + runCoins*3;

  // Ghost record
  recordGhost(bx,by);

  // Camera follow
  const targetX = bx+bvx*0.22;
  const targetY = by+6;
  camera.position.x += (targetX - camera.position.x)*0.08;
  camera.position.y += (targetY - camera.position.y)*0.06;
  camera.position.z = 24;
  camera.lookAt(bx+8, by+2, 0);

  // FOV speed kick
  const spdNorm = Math.min(1.2, bvx/VMAX);
  const diveVel = Math.min(0,bvy);
  const diveKick = Math.max(0,-diveVel/26)*warpT(spdNorm)*6;
  camera.fov = 62 + warpT(spdNorm)*10 + diveKick;
  camera.updateProjectionMatrix();

  // Terrain scroll
  updateTerrain(bx);

  // Backdrop parallax
  backdropA.position.x = camera.position.x*0.2;
  backdropB.position.x = camera.position.x*0.12;
  backdropC.position.x = camera.position.x*0.06;

  // Bird rotation
  const targetAngle = onGround ? Math.atan2(bvy,bvx) : Math.atan2(bvy,bvx)*0.7;
  birdGroup.rotation.z = targetAngle;
  birdGroup.position.set(bx,by,0);

  // Wing flap
  const flapT = performance.now()*0.004;
  const flapAmp = onGround?0.1:held?0.8:0.4;
  birdGroup.children.forEach(m=>{
    if (m.userData?.wing) m.rotation.x = Math.sin(flapT)*flapAmp * m.userData.side * -0.5;
  });

  // Trail
  pushTrail(bx,by,0,fever,manualBoostT>0);

  // Ghost bird
  if (ghostSnaps.length>0 && ghostBird) {
    if (!ghostBird.visible) ghostBird.visible=true;
    if (ghostPlayIdx<ghostSnaps.length) {
      const gs=ghostSnaps[ghostPlayIdx];
      ghostBird.position.set(gs.x,gs.y,0.5);
      if (bx>gs.x+50) ghostPlayIdx++;
    } else ghostBird.visible=false;
  }

  // Speed feel overlays
  const vign = document.getElementById('vignette');
  const strk = document.getElementById('streaks');
  const vigV = warpT(spdNorm)*0.55*(1+warpT(spdNorm)*0.45);
  vign.style.opacity=vigV.toFixed(3);
  strk.style.opacity=(warpT(spdNorm)*0.7).toFixed(3);

  // Altimeter
  const alt = Math.max(0,Math.min(1,(by-hillY(bx))/ALT_HIGH));
  document.getElementById('alt-bar').style.height=(alt*100)+'%';

  // Sky day/night (daylight fraction)
  const dT=Math.min(1,daylight/DAYLIGHT_MAX);
  skyMat.uniforms.uDayT.value+=(dT-skyMat.uniforms.uDayT.value)*dt*0.5;
  ambLight.intensity = 0.4+0.6*dT;
  sunLight.intensity = 0.5+1.1*dT;

  // Music
  scheduleMusic();

  // HUD
  updateHUD();

  renderer.render(scene,camera);
}

function updateHUD() {
  document.getElementById('score').textContent=distance+'m';
  document.getElementById('best-line').textContent='BEST '+save.best+'m';
  const dPct=Math.max(0,daylight/DAYLIGHT_MAX)*100;
  document.getElementById('daylight-bar').style.width=dPct+'%';
  document.getElementById('coins-hud').textContent=runCoins;
  // boost pip
  document.getElementById('pip0').classList.toggle('ready',manualBoostCD<=0);
}

function showCombo() {
  const cb=document.getElementById('combo-badge');
  cb.textContent=combo+'× COMBO';
  cb.style.opacity='1';
  setTimeout(()=>cb.style.opacity='0',1200);
}

// ─── Feedback ─────────────────────────────────────────────────────────────────
let _fbTimer=null;
function showFeedback(txt, color='#ffffff') {
  const el=document.getElementById('feedback');
  el.textContent=txt; el.style.color=color;
  el.classList.add('show');
  if (_fbTimer) clearTimeout(_fbTimer);
  _fbTimer=setTimeout(()=>el.classList.remove('show'),900);
}

// ─── Pause ────────────────────────────────────────────────────────────────────
function setPause(p) {
  if (p) {
    paused=true; state='pause';
    Poki.gameplayStop();
    showScreen('pause');
    document.getElementById('pause-dist').textContent=distance+'m';
    hud.hidden=true; altim.hidden=true;
  } else {
    paused=false; state='play';
    Poki.gameplayStart();
    showScreen(null); hud.hidden=false; altim.hidden=false;
    prevTime=performance.now();
  }
}

// ─── Revive ───────────────────────────────────────────────────────────────────
function offerRevive() {
  state='revive';
  Poki.gameplayStop();
  showScreen('revive');
  hud.hidden=true; altim.hidden=true;
  reviveT=15;
  document.getElementById('revive-timer').textContent=reviveT;
  document.getElementById('revive-cost').textContent='Watch an ad to keep flying!';
  if (reviveTicker) clearInterval(reviveTicker);
  reviveTicker=setInterval(()=>{
    reviveT--;
    document.getElementById('revive-timer').textContent=reviveT;
    if (reviveT<=0) { clearInterval(reviveTicker); endRun(); }
  },1000);
}

async function doReviveWatch() {
  clearInterval(reviveTicker);
  const granted=await Poki.rewardedBreak();
  if (granted) {
    bvx=20; bvy=10; daylight=Math.min(DAYLIGHT_MAX,daylight+16);
    state='play';
    showScreen(null); hud.hidden=false; altim.hidden=false;
    Poki.gameplayStart();
    prevTime=performance.now();
  } else {
    endRun();
  }
}

// ─── End run ─────────────────────────────────────────────────────────────────
function endRun() {
  if (reviveTicker) { clearInterval(reviveTicker); reviveTicker=null; }
  Poki.gameplayStop();
  // Save ghost
  if (distance>save.best) {
    ghostSnaps=[...ghostRec];
  }
  // Update save
  save.runs++;
  save.totalCoins=(save.totalCoins||0)+runCoins;
  save.coins+=runCoins;
  const prevBest=save.best;
  if (distance>save.best) save.best=distance;
  if (isDaily) {
    const today=new Date().toISOString().slice(0,10);
    save.daily={date:today,score:distance,done:true};
    save.dailyCompleted=(save.dailyCompleted||0)+1;
  }
  save.biomesFlown[_biome.id]=true;
  save.maxThermalsRun=Math.max(save.maxThermalsRun||0,thermalsThisRun);
  save.perfectLands=(save.perfectLands||0)+perfectLandsRun;
  checkAchievements();
  savePersist();
  state='over';
  showScreen('over');
  hud.hidden=true; altim.hidden=true;
  document.getElementById('over-dist').textContent=distance+'m';
  document.getElementById('over-label').textContent='DISTANCE';
  document.getElementById('over-best').textContent=distance>prevBest?'✨ NEW BEST!':('Best: '+save.best+'m');
  document.getElementById('over-coins').textContent='🪙 +'+runCoins;
  if (distance>prevBest) { playSfx(1046,0.8,'sine',0.15); Poki.happyTime(1); }
}

// ─── Achievements ─────────────────────────────────────────────────────────────
function checkAchievements() {
  for (const a of ACH) {
    if (!save.achievements[a.id] && a.req(save)) {
      save.achievements[a.id]=true;
      showFeedback('🏆 '+a.name,'#ffd700');
    }
  }
}

// ─── Nest (upgrades) ─────────────────────────────────────────────────────────
function openNest() {
  showScreen('nest');
  document.getElementById('nest-coins').textContent=save.coins+'🪙';
  const list=document.getElementById('upg-list');
  list.innerHTML='';
  for (const u of UPG) {
    const lvl=upgLevel(u.id);
    const card=document.createElement('div');
    card.className='upg-card'+(lvl>=u.max?' maxed':'');
    const cost=u.costs[lvl]||0;
    card.innerHTML=`
      <div class="upg-card-top">
        <span class="upg-name">${u.emoji} ${u.name}</span>
        <span class="upg-cost">${lvl>=u.max?'MAX':cost+'🪙'}</span>
      </div>
      <div class="upg-desc">${u.desc}</div>
      <div class="upg-dots">${Array.from({length:u.max},(_,i)=>`<div class="upg-dot${i<lvl?' filled':''}"></div>`).join('')}</div>
    `;
    if (lvl<u.max) {
      card.style.cursor='pointer';
      card.onclick=()=>{
        if (save.coins>=cost) {
          save.coins-=cost;
          save.upgrades[u.id]=(save.upgrades[u.id]||0)+1;
          savePersist();
          openNest();
          playSfx(880,0.2,'sine',0.1);
        } else {
          showFeedback('Not enough coins','#ff6644');
        }
      };
    }
    list.appendChild(card);
  }
  document.getElementById('btn-nest-back').onclick=()=>initMenu();
}

// ─── Skins ────────────────────────────────────────────────────────────────────
function openSkins() {
  showScreen('skins');
  document.getElementById('skins-coins').textContent=save.coins+'🪙';
  const grid=document.getElementById('skin-grid');
  grid.innerHTML='';
  for (const s of SKINS) {
    const owned=save.unlockedSkins.includes(s.id);
    const selected=save.skin===s.id;
    const card=document.createElement('div');
    card.className='skin-card'+(selected?' sel':'')+(owned?'':' locked');
    card.innerHTML=`<div class="skin-icon">${s.emoji}</div><div class="skin-name">${s.name}</div><div class="skin-price">${owned?'✓':s.cost+'🪙'}</div>`;
    card.onclick=()=>{
      if (!owned) {
        if (save.coins>=s.cost) {
          save.coins-=s.cost;
          save.unlockedSkins.push(s.id);
          save.skin=s.id;
          savePersist();
          checkAchievements();
          rebuildBird();
          openSkins();
          playSfx(1046,0.3,'sine',0.1);
        } else showFeedback('Not enough coins','#ff6644');
      } else {
        save.skin=s.id; savePersist();
        rebuildBird(); openSkins();
      }
    };
    grid.appendChild(card);
  }
  document.getElementById('btn-skins-back').onclick=()=>initMenu();
}

function rebuildBird() {
  scene.remove(birdGroup);
  birdGroup=makeBirdMesh(save.skin);
  birdGroup.add(shieldMesh); birdGroup.add(magMesh);
  scene.add(birdGroup);
}

// ─── Goals / Achievements ─────────────────────────────────────────────────────
function openGoals() {
  showScreen('goals');
  const done=Object.keys(save.achievements).length;
  document.getElementById('goals-done').textContent=done+'/'+ACH.length;
  const list=document.getElementById('ach-list');
  list.innerHTML='';
  for (const a of ACH) {
    const achieved=!!save.achievements[a.id];
    const row=document.createElement('div');
    row.className='ach-row';
    row.style.opacity=achieved?'1':'0.5';
    row.innerHTML=`
      <div class="ach-icon">${a.emoji}</div>
      <div class="ach-info">
        <div class="ach-name">${a.name}</div>
        <div class="ach-desc">${a.desc}</div>
      </div>
      <div class="ach-done">${achieved?'✅':''}</div>
    `;
    list.appendChild(row);
  }
  document.getElementById('btn-goals-back').onclick=()=>initMenu();
}

// ─── Start ────────────────────────────────────────────────────────────────────
initTerrain();
requestAnimationFrame(gameLoop);
</script>
