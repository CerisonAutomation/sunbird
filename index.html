<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4aa0e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Sunbird — a one-button arcade glider. Hold to dive, release to soar, chase the daylight across procedurally generated islands." />
    <title>Sunbird — Tiny Glide</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sunbird — Tiny Glide" />
    <meta property="og:description" content="A one-button arcade glider. Hold to dive, release to soar, chase the daylight across procedurally generated islands." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:url" content="https://cerison.itch.io/sunbird" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sunbird — Tiny Glide" />
    <meta name="twitter:description" content="A one-button arcade glider. Hold to dive, release to soar, chase the daylight across procedurally generated islands." />
    <meta name="twitter:image" content="/icons/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Self-hosted fonts (116 KB total): no CDN dependency, portal-safe,
         offline-safe. @font-face rules live in src/index.css. -->
    <link rel="preload" href="/fonts/fredoka-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root">
      <!-- Inline boot loader. Shown until React takes over the container, so a
           cold start on a slow connection is never a blank white page. Inline
           CSS only: no external requests, nothing to wait for. React clears
           #root on first render, which removes this. -->
      <style>
        .boot {
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          background: linear-gradient(180deg, #4aa0e8 0%, #a8e4ff 60%, #7ec8e8 100%);
          color: #16324a;
          font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }
        .boot-inner { display: grid; gap: 14px; justify-items: center; text-align: center; padding: 24px; }
        .boot-mark { position: relative; width: 92px; height: 72px; line-height: 1; animation: boot-bob 1.6s ease-in-out infinite; }
        .boot-sun { position: absolute; inset: 0 10px auto; color: #ffd45c; font-size: 64px; filter: drop-shadow(0 5px 8px rgba(194, 111, 20, .24)); }
        .boot-bird { position: absolute; right: 4px; bottom: 0; font-size: 36px; transform: rotate(-8deg); filter: drop-shadow(0 4px 5px rgba(83, 52, 31, .2)); }
        .boot-title { font-size: 20px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
        .boot-copy { max-width: 280px; color: #356078; font-size: 13px; line-height: 1.45; }
        .boot-retry { display: none; border: 0; border-radius: 999px; padding: 11px 18px; background: #ff8a3a; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
        .boot.is-error .boot-bar { display: none; }
        .boot.is-error .boot-copy, .boot.is-error .boot-retry { display: block; }
        .boot-bar { width: 132px; height: 6px; border-radius: 999px; background: rgba(22, 50, 74, 0.18); overflow: hidden; }
        .boot-bar i { display: block; width: 40%; height: 100%; border-radius: 999px; background: #ff8a3a; animation: boot-slide 1.1s ease-in-out infinite; }
        @keyframes boot-bob { 50% { transform: translateY(-6px); } }
        @keyframes boot-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(330%); } }
        @media (prefers-reduced-motion: reduce) {
          .boot-mark, .boot-bar i { animation: none; }
        }
      </style>
      <div class="boot" id="boot">
        <div class="boot-inner">
          <div class="boot-mark" aria-hidden="true"><span class="boot-sun">☀</span><span class="boot-bird">🐦</span></div>
          <div class="boot-title">Sunbird</div>
          <div class="boot-copy" id="boot-copy">Chasing daylight…</div>
          <div class="boot-bar" role="progressbar" aria-label="Loading Sunbird"><i></i></div>
          <button class="boot-retry" id="boot-retry" type="button">Reload Sunbird</button>
        </div>
      </div>
    </div>
    <!-- Recover clients that were pinned to an older app-shell worker. This
         runs before the module boot so a stale menu bundle cannot win the
         navigation race after a deploy or portal cache restore. -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((reg) => reg.unregister())).catch(() => {});
        if ("caches" in window) caches.keys().then((keys) => keys.forEach((key) => caches.delete(key))).catch(() => {});
      }
    </script>
    <script>
      (() => {
        const boot = document.getElementById("boot");
        const copy = document.getElementById("boot-copy");
        const retry = document.getElementById("boot-retry");
        if (!boot || !copy || !retry) return;
        retry.addEventListener("click", () => location.reload());
        if (location.protocol === "file:") {
          boot.classList.add("is-error");
          copy.textContent = "Open Sunbird from its hosted link or local game server. Browsers block the game modules when index.html is opened as a file.";
        }
        window.addEventListener("error", (event) => {
          if (!event.filename || !/\.tsx?|\.js$/.test(event.filename)) return;
          boot.classList.add("is-error");
          copy.textContent = "Sunbird could not start. Reload to try again.";
        }, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
